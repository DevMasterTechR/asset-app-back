# ============================================================
# Nginx — reverse proxy para asset-app-back
# Instalar en el VPS como:
#   /etc/nginx/sites-available/asset-app-back
#   ln -s /etc/nginx/sites-available/asset-app-back /etc/nginx/sites-enabled/
# Reemplaza api.tudominio.com por tu dominio real antes de usarlo.
# ============================================================

upstream asset_app_back {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: validación de Certbot + redirección a HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.tudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tudominio.com;

    # Estas rutas las genera/gestiona Certbot (ver VPS_DEPLOY.md)
    ssl_certificate     /etc/letsencrypt/live/api.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Subida de actas / archivos
    client_max_body_size 25m;

    access_log /var/log/nginx/asset-app-back.access.log;
    error_log  /var/log/nginx/asset-app-back.error.log;

    location / {
        proxy_pass http://asset_app_back;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Imprescindible: la app marca la cookie jwt como Secure en producción
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # Que Nginx no altere el CORS que ya emite NestJS
        proxy_pass_request_headers on;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://asset_app_back/health;
        access_log off;
    }
}
