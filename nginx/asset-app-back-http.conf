# ============================================================
# Nginx — bloque HTTP inicial para asset-app-back
#
# Pensado para VPS donde YA hay otros sitios en el mismo Nginx:
# solo declara el puerto 80. Luego `certbot --nginx -d TU_DOMINIO`
# añade el bloque 443, el certificado y la redirección automáticamente,
# sin tocar los demás sitios.
#
#   sed "s/DOMINIO_AQUI/gestor.techresources360.tech/g" \
#     nginx/asset-app-back-http.conf > /etc/nginx/sites-available/asset-app-back
#   ln -sf /etc/nginx/sites-available/asset-app-back /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d gestor.techresources360.tech
# ============================================================

# X-Forwarded-Proto correcto tanto si la petición llega directa como
# si pasa por Cloudflare (que ya envía la cabecera).
map $http_x_forwarded_proto $asset_app_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream asset_app_back {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_AQUI;

    # Subida de actas / archivos
    client_max_body_size 25m;

    access_log /var/log/nginx/asset-app-back.access.log;
    error_log  /var/log/nginx/asset-app-back.error.log;

    location / {
        proxy_pass http://asset_app_back;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Imprescindible: la app marca la cookie jwt como Secure en producción.
        # Detrás de Cloudflare, $scheme puede ser http en el origen; en ese caso
        # Cloudflare ya envía X-Forwarded-Proto: https y conviene propagarlo.
        proxy_set_header X-Forwarded-Proto $asset_app_fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;
        # requerido por el keepalive del upstream
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://asset_app_back/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
