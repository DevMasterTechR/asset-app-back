# ============================================================
# Nginx — front + API en un solo subdominio (bloque HTTP inicial)
#
#   https://DOMINIO_AQUI/            → front (build de React en /srv/asset-app-front/dist)
#   https://DOMINIO_AQUI/api/...     → API NestJS en 127.0.0.1:3000
#
# Mismo origen ⇒ no hay CORS y la cookie de sesión funciona sin trucos.
#
# Solo declara el puerto 80: `certbot --nginx -d DOMINIO_AQUI` añade después
# el bloque 443 y la redirección, sin tocar los otros sitios del VPS.
#
#   sed "s/DOMINIO_AQUI/gestor.techresources360.tech/g" nginx/gestor-http.conf \
#     > /etc/nginx/sites-available/gestor
#   ln -sf /etc/nginx/sites-available/gestor /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================

# X-Forwarded-Proto correcto tanto en acceso directo como detrás de Cloudflare.
map $http_x_forwarded_proto $gestor_fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream gestor_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_AQUI;

    # Subida de actas / imágenes
    client_max_body_size 25m;

    access_log /var/log/nginx/gestor.access.log;
    error_log  /var/log/nginx/gestor.error.log;

    # ---------- API ----------
    # La barra final en proxy_pass elimina el prefijo /api:
    #   /api/auth/login  →  http://127.0.0.1:3000/auth/login
    location /api/ {
        proxy_pass http://gestor_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gestor_fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;
        # requerido por el keepalive del upstream
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # /api sin barra → redirige, si no location /api/ no lo captura
    location = /api {
        return 301 /api/;
    }

    # ---------- Front (SPA) ----------
    root /srv/asset-app-front/dist;
    index index.html;

    # Los bundles de Vite llevan hash en el nombre: cacheables para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NUNCA se cachea: si no, tras un deploy el navegador
    # sigue pidiendo bundles viejos que ya no existen (pantalla en blanco).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # React Router: cualquier ruta desconocida la resuelve el front.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
