# ============================================================
# asset-app-back — Postgres + API, todo en el VPS
#
#   db  : Postgres 17 con volumen persistente (datos migrados de Supabase)
#   api : NestJS, expuesto solo en loopback; el acceso público entra por Nginx
#
# El puerto de Postgres se publica en 127.0.0.1:5433 (no 5432) para no
# chocar con otro Postgres que ya exista en el VPS.
# ============================================================
services:
  db:
    image: postgres:17-alpine
    container_name: asset-app-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      # Evita que un locale raro rompa los ORDER BY con acentos
      LANG: C.UTF-8

    volumes:
      - db-data:/var/lib/postgresql/data

    # Solo loopback: para pg_dump / psql desde el propio VPS.
    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: asset-app-back:latest
    container_name: asset-app-back
    restart: unless-stopped

    # No arranca hasta que Postgres acepte conexiones: PrismaService hace
    # process.exit(1) si falla el $connect inicial.
    depends_on:
      db:
        condition: service_healthy

    # Credenciales (BD, email, JWT) en .env
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3000"
      # Con la BD propia ya no hay drift: el dump de Supabase incluye
      # la tabla _prisma_migrations, así que migrate deploy queda al día.
      RUN_MIGRATIONS: "true"

    # Solo escucha en loopback: el acceso público entra por Nginx (443).
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db-data:
    name: asset-app-db-data
