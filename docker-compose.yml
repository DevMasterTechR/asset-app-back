services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: asset-app-back:latest
    container_name: asset-app-back
    restart: unless-stopped

    # Todas las credenciales (Supabase, email, JWT) viven en .env
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3000"
      # OJO: la BD de Supabase tiene drift — la migración
      # 20260513000000_add_parent_assignment_id ya está aplicada a mano
      # (columna + FK existen) pero no está registrada en _prisma_migrations,
      # así que `migrate deploy` fallaría. Ver paso 5-bis de VPS_DEPLOY.md:
      # tras hacer `migrate resolve --applied`, cambia esto a "true".
      RUN_MIGRATIONS: "false"

    # Solo escucha en loopback: el acceso público entra por Nginx (443).
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
